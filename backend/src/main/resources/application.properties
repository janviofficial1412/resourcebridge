spring.application.name=resourcebridge

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.jpa.open-in-view=false
logging.level.org.springframework.security=DEBUG
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
resourcebridge.image-storage.local-directory=${IMAGE_STORAGE_DIRECTORY:${user.home}/.resourcebridge/images}
resourcebridge.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
resourcebridge.ai.ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
resourcebridge.ai.ollama.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:2s}
resourcebridge.ai.ollama.response-timeout=${OLLAMA_RESPONSE_TIMEOUT:20s}

# Session cookie configuration for cross-port localhost SPA development
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
